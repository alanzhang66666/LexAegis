name: lexaegis
x-runtime: &runtime
  build: .
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  restart: unless-stopped
services:
  api:
    <<: *runtime
    ports: ["127.0.0.1:${LEX_COMPOSE_API_PORT:-38765}:8765"]
    environment:
      LEX_DATA_DIR: /data
      LEX_LOCAL_PASSWORD: ${LEX_LOCAL_PASSWORD:?Set a local password}
      LEX_GATEWAY_SECRET: ${LEX_GATEWAY_SECRET:?Set a signing secret}
      LEX_GATEWAY_URL: http://gateway:8766
      LEX_EDGE_URL: http://edge-model:8080/v1
      LEX_EDGE_MODEL: ${LEX_EDGE_MODEL:-}
      LEX_API_PORT: ${LEX_COMPOSE_API_PORT:-38765}
      LEX_CLOUD_ALLOWED_HOSTS: ${LEX_CLOUD_ALLOWED_HOSTS:-api.deepseek.com,dashscope.aliyuncs.com,dashscope-intl.aliyuncs.com,api.openai.com}
      LEX_ISOLATED: "1"
      LEX_DEPLOYMENT_MODE: isolated
      LEX_RUNTIME_ROLE: api
      PYTHONDONTWRITEBYTECODE: "1"
    volumes: ["app-data:/data"]
    # publish is not internal: Windows Docker otherwise drops 127.0.0.1 host bindings.
    # isolate-api-route then deletes the default route so the 1.1.1.1 probe still fails.
    networks: [internal, publish, redteam]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
  isolate-api-route:
    image: alpine:3.20
    network_mode: service:api
    depends_on:
      api: {condition: service_started}
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    command: ["sh", "-c", "ip route del default || true; exec sleep infinity"]
    restart: unless-stopped
  worker:
    <<: *runtime
    command: [python, -m, lexaegis.worker]
    depends_on:
      api: {condition: service_healthy}
    environment:
      LEX_DATA_DIR: /data
      LEX_GATEWAY_URL: http://gateway:8766
      LEX_GATEWAY_SECRET: ${LEX_GATEWAY_SECRET:?Set a signing secret}
      LEX_REDTEAM_SECRET: ${LEX_REDTEAM_SECRET:?Set a separate red-team signing secret}
      LEX_REDTEAM_URL: http://redteam:8767
      LEX_EDGE_URL: http://edge-model:8080/v1
      LEX_EDGE_MODEL: ${LEX_EDGE_MODEL:-}
      LEX_EDGE_ALLOWED_HOSTS: edge-model
      LEX_ISOLATED: "1"
      LEX_DEPLOYMENT_MODE: isolated
      LEX_RUNTIME_ROLE: worker
      PYTHONDONTWRITEBYTECODE: "1"
    volumes: ["app-data:/data"]
    networks: [internal, redteam]
  gateway:
    <<: *runtime
    command: [python, -m, uvicorn, "lexaegis.gateway:create_gateway", --factory, --host, 0.0.0.0, --port, "8766", --no-access-log]
    environment:
      LEX_GATEWAY_DIR: /data
      LEX_GATEWAY_SECRET: ${LEX_GATEWAY_SECRET:?Set a signing secret}
      LEX_CLOUD_API_KEY: ${LEX_CLOUD_API_KEY:-}
      LEX_CLOUD_PRIMARY_KEY: ${LEX_CLOUD_PRIMARY_KEY:-}
      LEX_CLOUD_STANDBY_KEY: ${LEX_CLOUD_STANDBY_KEY:-}
      LEX_CLOUD_STANDBY_HOST: ${LEX_CLOUD_STANDBY_HOST:-}
      LEX_CLOUD_ALLOWED_HOSTS: ${LEX_CLOUD_ALLOWED_HOSTS:-api.deepseek.com,dashscope.aliyuncs.com,dashscope-intl.aliyuncs.com,api.openai.com}
      LEX_RUNTIME_ROLE: gateway
      PYTHONDONTWRITEBYTECODE: "1"
    volumes: ["gateway-data:/data"]
    networks: [internal, egress]
  redteam:
    <<: *runtime
    profiles: [redteam]
    command: [python, -m, uvicorn, "lexaegis.redteam:app", --host, 0.0.0.0, --port, "8767", --no-access-log]
    environment:
      LEX_REDTEAM_SECRET: ${LEX_REDTEAM_SECRET:?Set a separate red-team signing secret}
      LEX_RUNTIME_ROLE: redteam
      PYTHONDONTWRITEBYTECODE: "1"
    networks: [redteam]
    # No volumes: neither raw documents nor truth labels can be read.
  benchmark:
    <<: *runtime
    profiles: [benchmark]
    command: [python, -m, lexaegis.cli, bench, --profile, ianvs-pipl]
    environment:
      LEX_RUNTIME_ROLE: benchmark
      PYTHONDONTWRITEBYTECODE: "1"
    networks: [redteam]
    # No volumes and no gateway secret: experiments cannot read cases, mappings, truth or credentials.
  edge-model:
    image: ${LEX_EDGE_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: [edge]
    command: [--model, /models/MiniCPM5-2B-Q4_K_M.gguf, --host, 0.0.0.0, --port, "8080", --alias, edge-small, --jinja, --ctx-size, "32768", --batch-size, "2048", --ubatch-size, "512", --parallel, "1", --cache-type-k, f16, --cache-type-v, f16, --n-gpu-layers, "99", --flash-attn, on]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes: ["./models:/models:ro"]
    networks: [internal, redteam]
networks:
  internal: {internal: true}
  redteam: {internal: true}
  egress: {}
  publish:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
volumes:
  app-data: {}
  gateway-data: {}
