# Template only — replace values via sealed-secrets / external secret store.
# Never commit real values. The gateway secret must differ from the red-team
# secret (docs/DEPLOY.md).
apiVersion: v1
kind: Secret
metadata:
  name: lexaegis-secrets
  namespace: lexaegis
type: Opaque
stringData:
  LEX_LOCAL_PASSWORD: "REPLACE_ME"
  LEX_GATEWAY_SECRET: "REPLACE_ME_32_CHARS_OR_LONGER"
  LEX_REDTEAM_SECRET: "REPLACE_ME_DISTINCT_FROM_GATEWAY"
  # LEX_CLOUD_API_KEY / LEX_CLOUD_PRIMARY_KEY / LEX_CLOUD_STANDBY_KEY are
  # mounted ONLY into the cloud-domain CGW pod — never into edge workloads.
  LEX_CLOUD_API_KEY: "REPLACE_ME_OPTIONAL"
