# Cloud domain: Cloud Capability Gateway (CGW). The only workload holding
# cloud provider credentials and the only workload with egress beyond the
# cluster. Mirrors compose.yaml service `gateway`.
# UNVERIFIED on a real cluster — see README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lexaegis-cgw
  namespace: lexaegis
  labels:
    app.kubernetes.io/name: lexaegis
    app.kubernetes.io/component: cloud-gateway
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/component: cloud-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lexaegis
        app.kubernetes.io/component: cloud-gateway
    spec:
      nodeSelector:
        lexaegis.io/domain: cloud     # runs on cloud-side nodes, never on edge
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: lexaegis:local
          imagePullPolicy: IfNotPresent
          command: [python, -m, uvicorn, "lexaegis.gateway:create_gateway",
                    "--factory", "--host", "0.0.0.0", "--port", "8766",
                    "--no-access-log"]
          env:
            - name: LEX_GATEWAY_DIR
              value: /gateway-data
            - name: LEX_GATEWAY_SECRET
              valueFrom: {secretKeyRef: {name: lexaegis-secrets, key: LEX_GATEWAY_SECRET}}
            # Provider credentials exist ONLY on this workload.
            - name: LEX_CLOUD_API_KEY
              valueFrom:
                secretKeyRef: {name: lexaegis-secrets, key: LEX_CLOUD_API_KEY, optional: true}
            - name: LEX_CLOUD_ALLOWED_HOSTS
              valueFrom: {configMapKeyRef: {name: lexaegis-config, key: LEX_CLOUD_ALLOWED_HOSTS}}
            - name: LEX_RUNTIME_ROLE
              value: gateway
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - {containerPort: 8766, name: http}
          readinessProbe:
            # /health requires an HMAC signature — a bare HTTP probe gets 401.
            tcpSocket: {port: http}
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: gateway-data, mountPath: /gateway-data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: gateway-data
          persistentVolumeClaim: {claimName: lexaegis-gateway-data}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: lexaegis-cgw
  namespace: lexaegis
spec:
  selector:
    app.kubernetes.io/component: cloud-gateway
  ports:
    - {port: 8766, targetPort: http, name: http}
