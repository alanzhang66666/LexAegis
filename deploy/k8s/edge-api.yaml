# Edge domain: LexAegis API (platform kernel). Scheduled onto the KubeEdge
# edge node; tolerates the edge taint. Mirrors compose.yaml service `api`.
# UNVERIFIED on a real cluster — see README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lexaegis-api
  namespace: lexaegis
  labels:
    app.kubernetes.io/name: lexaegis
    app.kubernetes.io/component: edge-api
spec:
  replicas: 1
  strategy: {type: Recreate}          # single-writer SQLite volume
  selector:
    matchLabels:
      app.kubernetes.io/component: edge-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lexaegis
        app.kubernetes.io/component: edge-api
    spec:
      nodeSelector:
        lexaegis.io/domain: edge      # label applied to the KubeEdge edge node
      tolerations:
        - key: node-role.kubernetes.io/edge
          operator: Exists
          effect: NoSchedule
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: lexaegis:local       # build via repo Dockerfile
          imagePullPolicy: IfNotPresent
          command: [python, -m, uvicorn, "lexaegis.api:create_app", "--factory",
                    "--host", "0.0.0.0", "--port", "8765", "--no-access-log"]
          envFrom:
            - configMapRef: {name: lexaegis-config}
          env:
            - name: LEX_LOCAL_PASSWORD
              valueFrom: {secretKeyRef: {name: lexaegis-secrets, key: LEX_LOCAL_PASSWORD}}
            - name: LEX_GATEWAY_SECRET
              valueFrom: {secretKeyRef: {name: lexaegis-secrets, key: LEX_GATEWAY_SECRET}}
            - name: LEX_RUNTIME_ROLE
              value: api
            - name: LEX_API_PORT
              value: "8765"
            - name: LEX_EDGE_NODE_ID      # audit field: which edge node ran this
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - {containerPort: 8765, name: http}
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: app-data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: app-data
          persistentVolumeClaim: {claimName: lexaegis-app-data}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: lexaegis-api
  namespace: lexaegis
spec:
  selector:
    app.kubernetes.io/component: edge-api
  ports:
    - {port: 8765, targetPort: http, name: http}
