[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexaegis"
version = "0.2.0"
description = "Local-first legal disclosure workbench with controlled cloud inference"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "httpx>=0.27,<1", "python-multipart>=0.0.18", "python-docx>=1.1,<2", "pypdfium2>=4.30,<6", "pillow>=10,<13", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
# CPU paddlepaddle only — do not add paddlepaddle-gpu (GPU reserved for llama-server).
ocr = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]
experiment = ["numpy>=2,<3", "scikit-learn>=1.6,<2"]

[project.scripts]
lexaegis = "lexaegis.cli:main"

[tool.setuptools.packages.find]
include = ["lexaegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient"
]
